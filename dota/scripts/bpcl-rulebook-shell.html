<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPC League — BPCL RuleBook (Season 3)</title>
  <style>
    :root {
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-heading: Georgia, "Palatino Linotype", "Times New Roman", serif;
      --color-bg: #ffffff;
      --color-text: #1c1917;
      --color-surface: #f5f5f4;
      --color-accent: #c2410c;
      --color-accent-100: #ffedd5;
      --color-accent-200: #fed7aa;
      --color-accent-700: #9a3412;
      --color-accent-2: #0f766e;
      --color-accent-2-200: #ccfbf1;
      --color-accent-2-700: #115e59;
      --radius-md: 10px;
      --radius-lg: 14px;
      --desk: #f5f5f4;
      --sheet-shadow: 0 2px 12px rgba(20, 20, 19, 0.1), 0 1px 3px rgba(20, 20, 19, 0.06);
    }

    :root[data-season="emerald"] {
      --color-accent: #059669;
      --color-accent-100: #d1fae5;
      --color-accent-200: #a7f3d0;
      --color-accent-700: #047857;
      --color-accent-2: #b45309;
      --color-accent-2-200: #fef3c7;
      --color-accent-2-700: #92400e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--desk);
      padding: 48px 24px;
      font-family: var(--font-body);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }

    .sheet {
      width: min(8.5in, 100%);
      margin: 0 auto;
      background: var(--color-bg);
      box-shadow: var(--sheet-shadow);
      border-radius: 8px;
      padding: 0.7in;
    }

    .tag {
      display: inline-block;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 9.5pt;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .tag-accent {
      background: var(--color-accent-100);
      color: var(--color-accent-700);
    }
    .tag-accent-2 {
      background: var(--color-accent-2-200);
      color: var(--color-accent-2-700);
    }
    .tag-neutral {
      background: var(--color-surface);
      color: var(--color-text);
    }

    ul { margin: 0; padding-left: 1.15rem; }
    li + li { margin-top: 0.35rem; }

    @media print {
      body { background: #fff; padding: 0; }
      .sheet {
        width: auto;
        margin: 0;
        box-shadow: none;
        border-radius: 0;
        padding: 0.7in;
      }
      [style*="break-before: page"] {
        break-before: page;
        page-break-before: always;
      }
    }
  </style>
</head>
<body>
  <div class="sheet">
<!--INNER-->
  </div>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("season") === "emerald") {
          document.documentElement.setAttribute("data-season", "emerald");
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
